version: "3.8"
services:
  react:
    build: ./frontend
    container_name: jewellery-frontend
    ports:
      - "3000:3000"
  mysql:
    container_name: jewellary-mysql
    image: mysql:8.0
    environment:
        MYSQL_ROOT_PASSWORD:
        MYSQL_DATABASE: jewellaryApp
    volumes:
        - mysql-data:/var/lib/mysql
  app:
    build: ./backend
    container_name: jewellery-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/jewellaryApp
        SPRING_DATASOURCE_USERNAME: 
        SPRING_DATASOURCE_PASSWORD: 
        SPRING_JPA_HIBERNATE_DDL_AUTO: update
        SPRING_JPA_SHOW_SQL: "true"

volumes:
  mysql-data: